<div class="cal-scroll">
  <div class="cal2" [class.arrastrando]="drag.sesionId() !== null">
    <div class="cal2-esquina"></div>
    <div class="cal2-h" *ngFor="let d of dias">{{ d.etiqueta }}</div>

    <div class="cal2-horas">
      <div class="cal2-hora" *ngFor="let h of horas" [style.height.px]="alto">{{ etiqueta(h) }}</div>
    </div>

    <div class="cal2-col" *ngFor="let col of columnas; trackBy: porDia" [style.height.px]="horas.length * alto">
      <div
        class="cal2-celda"
        *ngFor="let h of horas"
        [ngClass]="claseCelda(col.dia, h)"
        [style.height.px]="alto"
        (dragover)="alArrastrarSobre($event, col.dia, h)"
        (drop)="alSoltar($event, col.dia, h)"
      ></div>

      <div
        class="cal2-ses"
        *ngFor="let it of col.items; trackBy: porId"
        [ngClass]="'sem-' + (it.s.semestre % 10)"
        [class.seleccionada]="it.s.id === seleccionadaId"
        [class.editable]="editable"
        [attr.draggable]="editable"
        [attr.title]="titulo(it.s)"
        [style.top.px]="it.top"
        [style.height.px]="it.alto - 2"
        [style.left.%]="it.izq"
        [style.width.%]="it.ancho"
        (dragstart)="alIniciarArrastre($event, it.s)"
        (dragend)="alTerminarArrastre()"
        (click)="seleccionar.emit(it.s.id)"
      >
        <strong>{{ it.s.cursoCodigo }} · G{{ it.s.numeroGrupo }}</strong>
        <span>{{ it.s.cursoNombre }}</span>
        <small>{{ etiqueta(it.s.horaInicio!) }}–{{ etiqueta(it.s.horaFin!) }}</small>
        <small>{{ it.s.docenteNombre }}</small>
        <small>{{ it.s.aulaNombre }}<ng-container *ngIf="it.s.sedeNombre"> · {{ it.s.sedeNombre }}</ng-container></small>
      </div>
    </div>
  </div>
</div>
