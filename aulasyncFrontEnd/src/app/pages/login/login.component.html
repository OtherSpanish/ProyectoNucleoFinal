<div class="login">
  <div class="card">
    <h1>Aula Sync</h1>
    <p class="ayuda">Generación de horarios de clases</p>

    <form (ngSubmit)="ingresar()">
      <label>Correo
        <input name="correo" type="email" [(ngModel)]="correo" autocomplete="username" required autofocus>
      </label>
      <label>Contraseña
        <input name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required>
      </label>
      <p class="alerta ok" *ngIf="aviso()">{{ aviso() }}</p>
      <p class="alerta error" *ngIf="error" role="alert">{{ error }}</p>
      <button type="submit" class="primario" [disabled]="cargando">{{ cargando ? 'Ingresando…' : 'Ingresar' }}</button>
    </form>
  </div>
</div>
